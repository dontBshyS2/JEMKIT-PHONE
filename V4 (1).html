<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1c1c1e">
<title>Keijuの iPhone</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap">
<style>
:root{--ink:#fff;--sub:rgba(255,255,255,.65);--pink:#f6d6e4;--lilac:#d9d4f5;--sky:#cfe8f3;--bg:#0e0e10}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:var(--ink);font-family:-apple-system,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.phone{position:relative;width:100%;height:100dvh;max-width:430px;background:var(--bg);overflow:hidden}
@media(min-width:500px){.phone{height:min(calc(100dvh - 24px),900px);border-radius:44px;box-shadow:0 0 0 8px #1c1c1e,0 30px 80px rgba(0,0,0,.6)}}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.screen.on{display:flex;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
.pic{position:relative;background:linear-gradient(135deg,var(--pink),var(--lilac) 55%,var(--sky));background-size:cover;background-position:center;overflow:hidden;display:flex;align-items:center;justify-content:center}
.pic .ph{font-size:1.4em;opacity:.55;color:#6b5b8a}
.pic.ok .ph{display:none}
.wall{position:absolute;inset:0;background-size:cover;background-position:center;background-color:#2a2433}
.wall::after{content:"";position:absolute;inset:0}
.wall.lockw::after{background:linear-gradient(180deg,rgba(246,214,228,.35),rgba(207,232,243,.15) 60%,rgba(0,0,0,.35))}
.wall.homew::after{background:rgba(0,0,0,.28)}
.status{position:relative;z-index:2;display:flex;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 14px) 28px 0;font-size:15px;font-weight:500}
.status-icons{display:flex;align-items:center;gap:6px;height:18px}
.signal{display:flex;align-items:flex-end;gap:2px;height:13px}
.signal i{display:block;width:3px;border-radius:1px;background:#fff}
.signal i:nth-child(1){height:4px}.signal i:nth-child(2){height:6px}.signal i:nth-child(3){height:9px}.signal i:nth-child(4){height:12px}
.status-5g{font-size:12px;font-weight:600;letter-spacing:-.4px}
.battery{position:relative;width:23px;height:11px;border:1.3px solid rgba(255,255,255,.9);border-radius:3px;padding:1.5px;margin-left:1px}
.battery::before{content:"";display:block;width:75%;height:100%;border-radius:1px;background:#fff}
.battery::after{content:"";position:absolute;right:-3.5px;top:2.5px;width:2px;height:4px;border-radius:0 1px 1px 0;background:rgba(255,255,255,.85)}
.layer{position:relative;z-index:2}
#power{background:#000;align-items:center;justify-content:center}
#power button{color:var(--sub);font-size:15px;padding:18px 28px}
#power .dot{width:10px;height:10px;border-radius:50%;background:var(--pink);margin:0 auto 14px;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.25}}
#lock .center{text-align:center;margin-top:48px}
#lock .date{font-size:19px;font-weight:500;color:rgba(255,255,255,.9)}
#lock .time{font-size:92px;font-weight:300;line-height:1.05;letter-spacing:-2px}
#lock .own{margin-top:6px;color:var(--sub);font-size:14px}
#lock .hint{margin-top:auto;padding:0 0 36px;text-align:center;color:rgba(255,255,255,.85);font-size:15px}
#lock .hint b{display:block;margin:0 auto 10px;width:140px;height:5px;border-radius:3px;background:rgba(255,255,255,.7)}
#pass .ttl{text-align:center;margin-top:46px;font-size:19px}
#pass .sub{text-align:center;color:var(--sub);font-size:13px;margin-top:6px;min-height:18px}
.dots{display:flex;gap:18px;justify-content:center;margin:26px 0 20px}
.dots i{width:13px;height:13px;border:1.5px solid #fff;border-radius:50%}
.dots i.f{background:#fff}
.dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
/* 숫자 다이얼: 가로 중앙 정렬 */
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px 22px;width:max-content;margin:8px auto 0}
.pad button{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.18);backdrop-filter:blur(14px);font-size:32px;font-weight:300}
.pad button:active{background:rgba(255,255,255,.4)}
.pad .e{background:none;backdrop-filter:none;cursor:default}
.pbot{margin-top:auto;display:flex;justify-content:space-between;padding:0 40px calc(env(safe-area-inset-bottom) + 28px);font-size:15px}
.widget{margin:20px 18px 6px;padding:16px 18px;border-radius:24px;background:rgba(255,255,255,.2);backdrop-filter:blur(18px)}
.widget .wt{font-size:13px;color:var(--sub)}
.widget .wx{font-size:20px;font-weight:500;margin-top:6px;line-height:1.35}
.widget .wh{font-size:12px;color:var(--sub);margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 8px;padding:22px 16px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;cursor:pointer}
.ic{width:60px;height:60px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.app.off{opacity:1;cursor:default}
.dock{margin:auto 12px calc(env(safe-area-inset-bottom) + 14px);padding:14px;border-radius:32px;background:rgba(255,255,255,.22);backdrop-filter:blur(20px);display:grid;grid-template-columns:repeat(4,1fr)}
.dock .app span{display:none}
.app-screen{background:#fff;color:#111}
.hdr{flex:none;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 14px) 14px 10px;font-weight:700;font-size:18px;border-bottom:1px solid #eee;min-height:58px}
.hdr .bk{font-size:15px;font-weight:400;color:#6b5b8a;min-width:56px;text-align:left}
.hdr .sp{min-width:56px}
.body{flex:1;overflow-y:auto}
/* 하단 홈바: 누르면 하얀색으로 */
.hbar{flex:none;height:24px;display:flex;align-items:flex-start;justify-content:center;padding-top:6px;cursor:pointer}
.hbar i{width:130px;height:5px;border-radius:3px;background:#111;opacity:.8;transition:background .1s}
.kb{flex:none;height:24px;background:#fff;display:flex;justify-content:center;padding-top:6px;cursor:pointer}
.kb i{width:130px;height:5px;border-radius:3px;background:#111;opacity:.8;transition:background .1s}
.hbar:active i,.hbar.w i,.kb:active i,.kb.w i{background:#fff!important;opacity:1}
#photos .body{padding:2px}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.pg .pic{aspect-ratio:1;cursor:pointer}
.empty{padding:60px 20px;text-align:center;color:#999;font-size:14px}
/* 갤러리 뷰어 */
#viewer{background:#000;color:#fff}
#viewer .hdr{border:0;color:#fff}
#viewer .stage{flex:1;position:relative;overflow:hidden;touch-action:pan-y;user-select:none;background:#000}
#viewer .track{display:flex;height:100%;transition:transform .32s cubic-bezier(.22,.8,.3,1)}
#viewer .track.drag{transition:none}
#viewer .slide{flex:0 0 100%;height:100%;background-size:contain;background-repeat:no-repeat;background-position:center;background-color:#000}
#viewer .slide .ph{font-size:60px}
#viewer .cap{padding:10px 22px 12px;text-align:center}
#viewer .cap b{display:block;font-size:17px}
#viewer .cap span{font-size:13px;color:var(--sub)}
#viewer .hbar i{background:#fff}
.arr{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.22);backdrop-filter:blur(8px);font-size:24px;line-height:1;z-index:3;color:#fff}
.arr.l{left:10px}.arr.r{right:10px}.arr[hidden]{display:none}
/* 카카오톡 채팅방 공통 테마 (민제 / 우리끼리 / 매니저 모두 동일) */
.chat{background:var(--kbg,#b2c7d9);color:#222;font-family:var(--kfont,inherit)}
.chat .hdr{background:var(--kbg,#b2c7d9);border:0}
.kd{text-align:center;margin:10px auto 14px;font-size:12px;color:#fff;background:rgba(0,0,0,.18);padding:4px 14px;border-radius:14px;width:max-content}
.kd.day-divider{margin:18px auto 14px;padding:5px 14px;background:rgba(65,78,91,.42);color:rgba(255,255,255,.95);font-size:11.5px;letter-spacing:.1px}
.msgs{padding:0 12px 14px;display:flex;flex-direction:column;gap:8px}
.m{display:flex;gap:8px;align-items:flex-end}
.m.me{flex-direction:row-reverse}
.m .av{width:40px;height:40px;border-radius:15px;flex:none;align-self:flex-start}
.m .nm{font-size:12px;color:#444;margin-bottom:3px}
.bub{padding:8px 11px;border-radius:12px;background:var(--kthem,#fff);font-size:14.5px;line-height:1.4;max-width:230px;word-break:break-word;white-space:pre-wrap}
.me .bub{background:var(--kme,#fee500)}
.tm{font-size:10.5px;color:#556}
.kin{flex:none;padding:10px 12px;background:#fff;color:#aaa;font-size:14px;display:flex;gap:10px;align-items:center}
.kin input{flex:1;min-width:0;border:0;outline:0;background:#f2f2f2;color:#222;font:inherit;font-size:14px;border-radius:18px;padding:8px 14px}
.kin button{flex-shrink:0}
.kin .snd{color:#1674d1;font-size:13px;font-weight:600}
.stories{display:flex;gap:14px;padding:12px;overflow-x:auto;border-bottom:1px solid #eee}
.st{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;width:84px;flex:none}
.st .ring{padding:2.5px;border-radius:50%;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)}
.st span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st .ring .pic{width:58px;height:58px;border-radius:50%;border:2.5px solid #fff}
.post{padding-bottom:12px}
.ph1{display:flex;align-items:center;gap:10px;padding:10px 12px;font-weight:500;font-size:14px}
.ph1 .pic{width:34px;height:34px;border-radius:50%}
.post .main{aspect-ratio:4/5;width:100%}
.act{display:flex;align-items:center;gap:16px;padding:10px 12px 6px;color:#262626}
.act .sv{margin-left:auto}
.act button{display:flex;line-height:1;color:inherit}
.post .lk{padding:0 12px;font-weight:700;font-size:14px}
.post .cp{padding:4px 12px;font-size:14px;line-height:1.45;white-space:pre-wrap}
.post .cm,.post .tt{padding:2px 12px;font-size:12.5px;color:#888}
/* 인스타 프로필 */
.pf{display:flex;align-items:center;gap:22px;padding:16px}
.pf .pic{width:84px;height:84px;border-radius:50%;flex:none}
.pf .stat{display:flex;gap:22px;text-align:center;font-size:13px}
.pf .stat b{display:block;font-size:16px}
.pbio{padding:0 16px 14px;font-size:14px;white-space:pre-wrap}
.pbio b{display:block}
/* 최근 통화 */
#recents{background:#fff;color:#111}
#recents .hdr{border-bottom:0}
#recents .recents-title{padding:12px 20px 8px;font-size:30px;font-weight:700;letter-spacing:-1px}
#recents .recent-tabs{display:flex;gap:8px;padding:8px 16px 14px;border-bottom:1px solid #eee}
#recents .recent-tabs span{padding:7px 15px;border-radius:18px;background:#f0f0f5;font-size:13px;cursor:pointer}
#recents .recent-tabs span.active{background:#dcecfb;color:#1674d1;font-weight:600}
#recents .recent-section{padding:16px 20px 7px;color:#777;font-size:13px}
#recents .recent-item{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid #eee;cursor:pointer}
#recents .recent-avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
#recents .recent-info{flex:1;min-width:0}
#recents .recent-name{font-size:16px;font-weight:600}
#recents .recent-detail{margin-top:4px;color:#888;font-size:12px}
#recents .recent-time{color:#888;font-size:12px;white-space:nowrap}
#recents .recent-call{color:#34a853;font-size:23px;padding:8px}
#call{background:linear-gradient(180deg,#3a3350,#1c1a26);align-items:center;text-align:center}
#call .who{margin-top:70px}
#call .pic{width:120px;height:120px;border-radius:50%;margin:0 auto 18px}
#call .pic .ph{font-size:54px}
#call h2{font-size:30px;font-weight:500}
#call p{color:var(--sub);margin-top:8px;font-size:15px;padding:0 30px}
#call .btns{margin-top:auto;display:flex;gap:80px;padding-bottom:calc(env(safe-area-inset-bottom) + 70px)}
.cb{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px}
.cb i{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;font-style:normal}
.red i{background:#ff3b30}.grn i{background:#34c759}
#call .on-call{display:none}
#call.live .on-call{display:flex}
#call.live .ringing{display:none}
#call p.on-call{display:none}
#call.live p.on-call{display:block}
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(30,30,34,.9);padding:9px 16px;border-radius:16px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:9;white-space:nowrap}
.toast.s{opacity:1}
/* 발신 중 화면 */
#call.outgoing{background:linear-gradient(180deg,#3a3350,#1c1a26);color:#fff}
#call.outgoing .who{margin-top:100px}
#call.outgoing .ringing,#call.outgoing .on-call{display:none!important}
#call.outgoing .outgoing-status{display:block;color:rgba(255,255,255,.7);margin-top:12px;font-size:15px}
#call.outgoing .outgoing-btns{display:flex}
#call .outgoing-status,#call .outgoing-btns{display:none}
.app-badge{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;padding:0 5px;display:flex;align-items:center;justify-content:center;box-sizing:border-box;border-radius:999px;background:#ff3b30;color:#fff;font-size:12px;font-weight:700;line-height:1;border:1.5px solid #fff;z-index:10}
/* 카카오톡 친구·채팅 목록 */
#kakao{background:#fff;color:#222}
#kakao .kakao-top{flex:none;padding:calc(env(safe-area-inset-top) + 15px) 20px 12px;background:#fff}
#kakao .kakao-topline{display:flex;align-items:center;justify-content:space-between}
#kakao .kakao-title{font-size:25px;font-weight:700;letter-spacing:-1px}
#kakao .kakao-tools{display:flex;gap:17px;font-size:21px}
#kakao .kakao-search{margin-top:15px;padding:10px 13px;border-radius:9px;background:#f5f5f5;color:#999;font-size:13px}
#kakao .kakao-tabs{display:flex;flex:none;border-bottom:1px solid #eee}
#kakao .kakao-tab{position:relative;flex:1;padding:13px 4px;color:#999;font-size:14px;text-align:center}
#kakao .kakao-tab.active{color:#222;font-weight:700}
#kakao .kakao-tab.active::after{content:"";position:absolute;bottom:0;left:25%;right:25%;height:3px;border-radius:3px;background:#fee500}
#kakao .kakao-list{flex:1;overflow-y:auto;padding-bottom:8px}
#kakao .kakao-section{padding:15px 17px 8px;color:#999;font-size:12px}
#kakao .kakao-profile,#kakao .kakao-room{display:flex;align-items:center;gap:12px;width:100%;padding:10px 16px;color:#222;text-align:left}
#kakao .kakao-profile:active,#kakao .kakao-room:active{background:#f8f8f8}
#kakao .kakao-avatar{position:relative;display:flex;align-items:center;justify-content:center;flex:none;width:49px;height:49px;overflow:hidden;border-radius:18px;background:#f3e6ed;font-size:23px}
#kakao .kakao-avatar.round{border-radius:50%}
#kakao .kakao-avatar img{width:100%;height:100%;object-fit:cover}
#kakao .kakao-detail{flex:1;min-width:0}
#kakao .kakao-name{font-size:14px;font-weight:600}
#kakao .kakao-preview{margin-top:5px;overflow:hidden;color:#999;font-size:12px;text-overflow:ellipsis;white-space:nowrap}
#kakao .kakao-meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;color:#aaa;font-size:10px}
#kakao .kakao-unread{min-width:18px;padding:3px 5px;border-radius:12px;background:#f15b5b;color:#fff;font-size:10px;text-align:center}
#kakao .kakao-bottom{flex:none;display:flex;justify-content:space-around;padding:10px 0 2px;border-top:1px solid #eee;background:#fff}
#kakao .kakao-bottom button{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:60px;color:#aaa;font-size:10px}
#kakao .kakao-bottom button.active{color:#222}
#kakao .kakao-bottom .tab-icon{font-size:21px}

.ph1 .more{margin-left:auto;color:#262626;letter-spacing:1px}
.ph1 span.u{font-weight:600}
.ignav{flex:none;display:flex;justify-content:space-around;align-items:center;padding:8px 0 6px;border-top:1px solid #eee;background:#fff}
.ignav button{width:44px;height:36px;display:flex;align-items:center;justify-content:center;color:#262626}
.ignav button.on svg{stroke-width:2.8}
.ignav .navav{width:26px;height:26px;border-radius:50%}
.ignav button.on .navav{outline:2px solid #262626;outline-offset:1px}
.pbtn{display:flex;gap:8px;padding:0 16px 14px}
.pbtn button{flex:1;background:#efefef;border-radius:8px;padding:8px 0;font-size:13px;font-weight:600;color:#111}
.pg4 .pic{aspect-ratio:3/4}
</style>
</head>
<body>
<div class="phone" id="phone"></div>

/* ------------------------- 공통 도구 ------------------------- */
const S = JEMKIT_SETTINGS;
const $ = (s, r = document) => r.querySelector(s);
function el(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function setImg(node, url) {          // 로딩에 성공했을 때만 적용 → 실패하면 플레이스홀더 유지
  if (!url) return;
  const i = new Image();
  i.onload = () => { node.style.backgroundImage = 'url("' + url.replace(/"/g, '%22') + '")'; node.classList.add('ok'); };
  i.src = url;
}
function pic(url, cls, fb) {
  const w = el('div', 'pic ' + (cls || '')); w.appendChild(el('span', 'ph', fb || '✿')); setImg(w, url); return w;
}
function screen(id, cls) { const s = el('section', 'screen ' + (cls || '')); s.id = id; $('#phone').appendChild(s); return s; }
function header(title) {
  const h = el('div', 'hdr'), b = el('button', 'bk', '‹ 뒤로'); b.dataset.back = '1';
  h.append(b, el('span', '', title), el('span', 'sp')); return h;
}
function hbar(cls) { const b = el('div', cls || 'hbar'); b.dataset.home = '1'; b.appendChild(el('i')); return b; }
function toast(t) { const n = $('.toast'); n.textContent = t; n.classList.add('s'); clearTimeout(toast.t); toast.t = setTimeout(() => n.classList.remove('s'), 1600); }
function avatarOf(name) {            // 이름으로 프로필 사진 찾기 (없으면 카카오톡 기본 프로필)
  const K = S.kakao; if (name === K.name) return K.avatar || window.JEMKIT_DEFAULT_PROFILE;
  const f = K.friends.find(x => x.name === name);
  return (f && f.avatar) || (name === S.managerChat.name && S.managerChat.avatar) || window.JEMKIT_DEFAULT_PROFILE;
}
function setCallee(name) {
  const h = $('#call .who h2'), av = $('#call .who .pic'); if (!h) return; h.textContent = name;
  if (av) { av.style.backgroundImage = ''; av.classList.remove('ok'); av.style.background = 'transparent'; av.querySelector('.ph')?.remove(); av.style.display = 'none'; }
}
function nowTime() { return new Date().toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit', hour12: true }); }

/* ------------------------- 화면 이동 ------------------------- */
let cur = 'power'; const hist = [];
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); cur = id;
  const sc = document.getElementById(id);               // 채팅방은 열 때 항상 맨 아래(최신 메시지)로
  if (sc && sc.classList.contains('chat')) requestAnimationFrame(() => { const bd = $('.body', sc); if (bd) bd.scrollTop = bd.scrollHeight; });
}
function go(id) { hist.push(cur); show(id); }
function back() { show(hist.pop() || 'home'); }
function home() { hist.length = 0; show('home'); }

/* ------------------------- 신호음 (WebAudio) ------------------------- */
let AC = null, ringT = null, ringAudio = null;
const ytPlayers = { ringtone: null, ringback: null };
const ytReady = { ringtone: false, ringback: false };
let ytApiReady = false;
function audioOn() { if (S.call.sound === false) return false; try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); return true; } catch (e) { return false; } }
function beep(f, at, d, v) {
  if (!AC) return; const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + at;
  o.frequency.value = f; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v || .15, t + .02); g.gain.linearRampToValueAtTime(0, t + d);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .05);
}
function initYouTubePlayers() {
  if (window.YT && window.YT.Player) { createYTPlayers(); return; }
  if (!document.getElementById('yt-iframe-api')) {
    const tag = document.createElement('script'); tag.id = 'yt-iframe-api'; tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
  }
  const previous = window.onYouTubeIframeAPIReady;
  window.onYouTubeIframeAPIReady = function() { if (typeof previous === 'function') previous(); createYTPlayers(); };
}
function createYTPlayers() {
  if (ytApiReady || !window.YT || !window.YT.Player) return;
  ytApiReady = true;
  const holder = el('div'); holder.id = 'yt-audio-players'; holder.style.cssText = 'position:fixed;width:1px;height:1px;left:-20px;top:0;overflow:hidden;opacity:.01;pointer-events:none';
  ['ringtone','ringback'].forEach(kind => { const node = el('div'); node.id = 'yt-' + kind; holder.appendChild(node); });
  document.body.appendChild(holder);
  ytPlayers.ringtone = new YT.Player('yt-ringtone', { width: '1', height: '1', videoId: S.call.ringtoneVideoId, playerVars: { autoplay: 0, controls: 0, playsinline: 1, loop: 1, playlist: S.call.ringtoneVideoId }, events: { onReady: e => { ytReady.ringtone = true; e.target.setVolume(100); } } });
  ytPlayers.ringback = new YT.Player('yt-ringback', { width: '1', height: '1', videoId: S.call.ringbackVideoId, playerVars: { autoplay: 0, controls: 0, playsinline: 1, loop: 1, playlist: S.call.ringbackVideoId }, events: { onReady: e => { ytReady.ringback = true; e.target.setVolume(100); } } });
}
function playYT(kind) {
  const player = ytPlayers[kind];
  if (player && ytReady[kind] && typeof player.playVideo === 'function') { try { player.seekTo(0, true); player.playVideo(); return true; } catch(e) {} }
  return false;
}
function stopYT() { Object.values(ytPlayers).forEach(p => { try { if (p && p.stopVideo) p.stopVideo(); } catch(e) {} }); }
function playUnlockSound() {
  if (!audioOn()) return;
  // 짧고 부드럽게 올라가는 '윙-' 느낌의 합성음
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(520, t); o.frequency.exponentialRampToValueAtTime(1180, t + .16); o.frequency.exponentialRampToValueAtTime(760, t + .34);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.12, t + .035); g.gain.exponentialRampToValueAtTime(.0001, t + .38);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + .4);
}
function stopRing() { clearInterval(ringT); ringT = null; if (ringAudio) { ringAudio.pause(); ringAudio = null; } stopYT(); }
function mallet(f, at, v) {         // 말렛(마림바 비슷한) 소리 한 음
  if (!AC) return; const t = AC.currentTime + at, g = AC.createGain(), o = AC.createOscillator(), o2 = AC.createOscillator();
  o.type = 'sine'; o2.type = 'triangle'; o.frequency.value = f; o2.frequency.value = f * 2;
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v || .2, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + .75);
  o.connect(g); o2.connect(g); g.connect(AC.destination); o.start(t); o2.start(t); o.stop(t + .8); o2.stop(t + .8);
}
function startRing() {              // 전화 수신 벨소리: 지정한 YouTube 영상
  stopRing(); if (!audioOn()) return;
  if (playYT('ringtone')) return;
  // YouTube 플레이어가 아직 준비되지 않은 경우를 위한 합성 벨소리
  const N = [659, 784, 988, 1319, 988, 784, 659, 784, 880, 1175, 880, 740, 880, 988, 784, 659];
  const p = () => N.forEach((f, i) => mallet(f, i * .17)); p(); ringT = setInterval(p, 3600);
}
function startRingback() {          // 발신 연결음: 지정한 YouTube 영상
  stopRing(); if (!audioOn()) return;
  if (playYT('ringback')) return;
  const p = () => beep(440, 0, 1, .12); p(); ringT = setInterval(p, 3000);
}
function playConnect() { if (audioOn()) { beep(1000, 0, .12); beep(1400, .15, .15); } }

function playMessageTone() {       // 카톡 알림: 아이폰 '띵-' 소리
  if (S.kakao.notifySound === false) return;
  if (S.kakao.notifyToneUrl) { new Audio(S.kakao.notifyToneUrl).play().catch(() => {}); return; }
  if (!audioOn()) return;
  const t = AC.currentTime, g = AC.createGain(), a = AC.createOscillator(), b = AC.createOscillator(), g2 = AC.createGain();
  a.type = b.type = 'sine'; a.frequency.value = 1318.5; b.frequency.value = 1975.5; g2.gain.value = .35;
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.25, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + 1.4);
  a.connect(g); b.connect(g2); g2.connect(g); g.connect(AC.destination); a.start(t); b.start(t); a.stop(t + 1.5); b.stop(t + 1.5);
}

  b.appendChild(g); s.append(b, hbar());

  const v = screen('viewer'), vh = header(''), stage = el('div', 'stage'), track = el('div', 'track');
  const slides = S.photos.map(() => { const d = el('div', 'slide pic'); d.appendChild(el('span', 'ph', '🌸')); track.appendChild(d); return d; });
  const prev = el('button', 'arr l', '‹'), next = el('button', 'arr r', '›');
  stage.append(track, prev, next); v.append(vh, stage, hbar());
  const n = S.photos.length, loaded = {}; let idx = 0, sx = null, dx = 0;
  const load = i => { if (i < 0 || i >= n || loaded[i]) return; loaded[i] = 1; setImg(slides[i], S.photos[i].image); };
  function set(i) {
    idx = Math.max(0, Math.min(n - 1, i)); track.classList.remove('drag');
    track.style.transform = 'translateX(' + (-idx * 100) + '%)'; load(idx - 1); load(idx); load(idx + 1);
    vh.children[1].textContent = (idx + 1) + ' / ' + n; prev.hidden = idx === 0; next.hidden = idx >= n - 1;
  }
  prev.onclick = () => set(idx - 1); next.onclick = () => set(idx + 1);
  stage.addEventListener('pointerdown', e => { if (e.target.closest('.arr')) return; sx = e.clientX; dx = 0; track.classList.add('drag'); stage.setPointerCapture(e.pointerId); });
  stage.addEventListener('pointermove', e => { if (sx == null) return; dx = e.clientX - sx; track.style.transform = 'translateX(calc(' + (-idx * 100) + '% + ' + dx + 'px))'; });
  const end = () => { if (sx == null) return; const d = dx; sx = null; set(d < -50 ? idx + 1 : d > 50 ? idx - 1 : idx); };
  stage.addEventListener('pointerup', end); stage.addEventListener('pointercancel', end);
  document.addEventListener('keydown', e => { if (cur !== 'viewer') return; if (e.key === 'ArrowLeft') set(idx - 1); if (e.key === 'ArrowRight') set(idx + 1); });
  window.openPhoto = i => { go('viewer'); set(i); };
}

  b.appendChild(st);
  I.posts.forEach(p => {
    const d = el('article', 'post'), top = el('div', 'ph1'); top.append(pic(p.avatar || window.JEMKIT_DEFAULT_PROFILE, '', '🙂'), el('span', 'u', p.user), el('span', 'more', '•••'));
    if (p.user === I.profile.user) { top.style.cursor = 'pointer'; top.onclick = () => go('instaProfile'); }
    const act = el('div', 'act'), heart = el('button'), lk = el('div', 'lk'), cbtn = el('button'), sbtn = el('button'), save = el('button', 'sv');
    let n = Number(p.likes) || 0, on = false;
    const paint = () => {
      lk.textContent = '좋아요 ' + n.toLocaleString('ko-KR') + '개'; heart.replaceChildren(svgIcon(IG.heart, 26, on ? 'fill="#ed4956" stroke="#ed4956"' : ''));
    };
    heart.onclick = () => { on = !on; n += on ? 1 : -1; paint(); }; paint();
    cbtn.appendChild(svgIcon(IG.comment, 25)); sbtn.appendChild(svgIcon(IG.share, 25)); save.appendChild(svgIcon(IG.save, 25));
    cbtn.onclick = sbtn.onclick = save.onclick = () => toast('아직 준비 중이에요');
    act.append(heart, cbtn, sbtn, save);
    const cp = el('div', 'cp'); cp.append(el('b', '', p.user + ' '), document.createTextNode(p.caption || ''));
    d.append(top, pic(p.image, 'main', '📷'), act, lk, cp, el('div', 'cm', p.comments || ''), el('div', 'tt', p.time || ''));
    b.appendChild(d);
  });
  s.append(b, instaNav('home'), hbar());
}

function renderInstaProfile() {
  const P = S.instagram.profile, s = screen('instaProfile', 'app-screen'); s.appendChild(header(P.user));
  const b = el('div', 'body'), mine = S.instagram.posts.filter(p => p.user === P.user), top = el('div', 'pf'), st = el('div', 'stat');
  [[mine.length, '게시물'], [P.followers, '팔로워'], [P.following, '팔로잉']].forEach(([n, l]) => { const d = el('div'); d.append(el('b', '', String(n)), document.createTextNode(l)); st.appendChild(d); });
  top.append(pic(P.avatar || window.JEMKIT_DEFAULT_PROFILE, '', '🙂'), st);
  const bio = el('div', 'pbio'); bio.append(el('b', '', P.name), document.createTextNode(P.bio || ''));
  const btns = el('div', 'pbtn'); ['프로필 편집', '프로필 공유'].forEach(t => { const x = el('button', '', t); x.onclick = () => toast('아직 준비 중이에요'); btns.appendChild(x); });
  const g = el('div', 'pg pg4'); mine.forEach(p => g.appendChild(pic(p.image, '', '📷')));
  b.append(top, bio, btns, g); s.append(b, instaNav('profile'), hbar());
}

/* ------------------------- 최근 통화 ------------------------- */
function renderRecents() {
  const s = screen('recents', 'app-screen'); s.appendChild(header('전화'));
  const b = el('div', 'body'); b.appendChild(el('div', 'recents-title', '최근 통화'));
  const tabs = el('div', 'recent-tabs'), allTab = el('span', 'active', '전체'), missedTab = el('span', '', '부재중');
  tabs.append(allTab, missedTab); b.appendChild(tabs);

  const history = [                 // 줄 하나 = 통화 기록 하나 (이름은 친구 목록 이름과 같게 쓰면 프로필 사진이 자동 적용)
    { day: '오늘', name: '민제',     detail: '부재중 통화',      time: '오후 3:32',  missed: true },
    { day: '오늘', name: '민제',     detail: '부재중 전화',      time: '오후 3:15',  missed: true },
    { day: '오늘', name: '동현이',   detail: '발신 통화',        time: '오후 2:10',  missed: false },
    { day: '오늘', name: '매니저형', detail: '수신 통화 · 3분',  time: '오후 1:45',  missed: false },
    { day: '오늘', name: '민제',     detail: '발신 통화',        time: '오전 11:42', missed: false },
    { day: '오늘', name: '매니저형', detail: '부재중 전화',      time: '오전 10:20', missed: true },
    { day: '어제', name: '민제',     detail: '수신 통화 · 4분',  time: '어제',       missed: false },
    { day: '어제', name: '왕이',     detail: '수신 통화 · 1분',  time: '어제',       missed: false }
  ];
  const list = el('div');
  function drawHistory(missedOnly) {
    list.replaceChildren();
    const items = history.filter(item => !missedOnly || item.missed);
    if (!items.length) { list.appendChild(el('div', 'empty', '통화 내역이 없어요')); return; }
    let lastDay = '';
    items.forEach(item => {
      if (item.day !== lastDay) { list.appendChild(el('div', 'recent-section', item.day)); lastDay = item.day; }
      const row = el('div', 'recent-item'), info = el('div', 'recent-info'), name = el('div', 'recent-name', item.name), detail = el('div', 'recent-detail', item.detail);
      const callBtn = el('button', 'recent-call', '☎');
      if (item.missed) { name.style.color = '#ff3b30'; detail.style.color = '#ff3b30'; }
      info.append(name, detail); const genericAvatar = el('div', 'recent-avatar', '👤'); genericAvatar.style.background = '#f0f0f5'; genericAvatar.style.color = '#8e8e93'; row.append(genericAvatar, info, el('div', 'recent-time', item.time), callBtn);
      row.onclick = () => outgoingCall(item.name); callBtn.onclick = e => { e.stopPropagation(); outgoingCall(item.name); };
      list.appendChild(row);
    });
  }
  drawHistory(false);
  allTab.onclick = () => { allTab.classList.add('active'); missedTab.classList.remove('active'); drawHistory(false); };
  missedTab.onclick = () => { missedTab.classList.add('active'); allTab.classList.remove('active'); drawHistory(true); };
  b.appendChild(list); s.append(b, hbar());
}

/* ------------------------- 전화 ------------------------- */
let callTimer = null, autoT = null;
function renderCall() {
  const C = S.call, s = screen('call'), who = el('div', 'layer who');
  const emptyAvatar = el('div', 'pic'); emptyAvatar.style.display = 'none'; who.append(emptyAvatar, el('h2', '', C.name), el('p', 'ringing', C.text), el('p', 'on-call', ''));
  const rb = el('div', 'layer btns ringing'), ob = el('div', 'layer btns on-call');
  const mk = (cls, ic, label, fn) => { const b = el('button', 'cb ' + cls); b.append(el('i', '', ic), el('span', '', label)); b.onclick = fn; return b; };
  rb.append(mk('red', '✕', '거절', endCall), mk('grn', '✆', '수락', accept));
  ob.append(mk('red', '✕', '통화 종료', endCall));
  s.append(who, rb, ob);
}
function ring() { setCallee(S.call.name); clearInterval(callTimer); $('#call').classList.remove('live', 'outgoing'); if (cur !== 'call') go('call'); startRing(); }
function accept() {
  stopRing(); playConnect();
  $('#call').classList.add('live'); const t = $('#call p.on-call'); let sec = 0;
  const upd = () => { t.textContent = S.call.acceptedText + '  ' + String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0'); };
  upd(); clearInterval(callTimer); callTimer = setInterval(() => { sec++; upd(); }, 1000);
}

function outgoingCall(name) {
  name = name || S.call.name; setCallee(name);
  clearInterval(callTimer);
  const s = $('#call'); s.classList.remove('live'); s.classList.add('outgoing');
  const who = $('#call .who');
  let stt = who.querySelector('.outgoing-status'); if (!stt) { stt = el('p', 'outgoing-status'); who.appendChild(stt); } stt.textContent = name + '에게 전화 거는 중…';
  if (!s.querySelector('.outgoing-btns')) {
    const buttons = el('div', 'layer btns outgoing-btns'), endButton = el('button', 'cb red');
    endButton.append(el('i', '', '✕'), el('span', '', '통화 종료')); endButton.onclick = endOutgoingCall;
    buttons.appendChild(endButton); s.appendChild(buttons);
  }
  if (cur !== 'call') go('call');
  startRingback();
}
function endOutgoingCall() { stopRing(); clearInterval(callTimer); $('#call').classList.remove('outgoing'); back(); }
function endCall() { stopRing(); clearInterval(callTimer); $('#call').classList.remove('live'); back(); }
function armAutoRing() {
  clearTimeout(autoT); const n = Number(S.call.autoRingAfterSec) || 0;
  if (n > 0) autoT = setTimeout(() => { if (cur === 'home') ring(); }, n * 1000);
}

(function init() {
  initYouTubePlayers();
  applyKakaoTheme();
  renderPower();
  renderLock();
  renderPass();
  renderHome();
  renderPhotos();
  renderKakao();
  renderKakaoChat();
  renderExtraChat('groupChatScreen', S.groupChat, true);
  renderExtraChat('managerChatScreen', S.managerChat);
  renderInsta();
  renderInstaProfile();
  renderRecents();
  renderCall();

  $('#phone').appendChild(el('div', 'toast'));

  document.addEventListener('click', e => {
    const t = e.target.closest('[data-back],[data-home]');
    if (!t) return;
    if (t.dataset.home) { t.classList.add('w'); setTimeout(() => { t.classList.remove('w'); home(); }, 160); }   // 홈바가 하얗게 바뀐 뒤 홈으로
    else back();
  });

  tickClock();
  setInterval(tickClock, 1000);
  show('power');
})();
</script>
