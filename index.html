<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1c1c1e">
<title>Keijuの iPhone</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap">
<style>
:root{--ink:#fff;--sub:rgba(255,255,255,.65);--pink:#f6d6e4;--lilac:#d9d4f5;--sky:#cfe8f3;--bg:#0e0e10}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:var(--ink);font-family:-apple-system,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.phone{position:relative;width:100%;height:100dvh;max-width:430px;background:var(--bg);overflow:hidden}
@media(min-width:500px){.phone{height:min(calc(100dvh - 24px),900px);border-radius:44px;box-shadow:0 0 0 8px #1c1c1e,0 30px 80px rgba(0,0,0,.6)}}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.screen.on{display:flex;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
.pic{position:relative;background:linear-gradient(135deg,var(--pink),var(--lilac) 55%,var(--sky));background-size:cover;background-position:center;overflow:hidden;display:flex;align-items:center;justify-content:center}
.pic .ph{font-size:1.4em;opacity:.55;color:#6b5b8a}
.pic.ok .ph{display:none}
.wall{position:absolute;inset:0;background-size:cover;background-position:center;background-color:#2a2433}
.wall::after{content:"";position:absolute;inset:0}
.wall.lockw::after{background:linear-gradient(180deg,rgba(246,214,228,.35),rgba(207,232,243,.15) 60%,rgba(0,0,0,.35))}
.wall.homew::after{background:rgba(0,0,0,.28)}
.status{position:relative;z-index:2;display:flex;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 14px) 28px 0;font-size:15px;font-weight:500}

.status-icons {
  display: flex;
  align-items: center;
  gap: 6px;
  height: 18px;
}

.signal {
  display: flex;
  align-items: flex-end;
  gap: 2px;
  height: 13px;
}

.signal i {
  display: block;
  width: 3px;
  border-radius: 1px;
  background: #fff;
}

.signal i:nth-child(1) { height: 4px; }
.signal i:nth-child(2) { height: 6px; }
.signal i:nth-child(3) { height: 9px; }
.signal i:nth-child(4) { height: 12px; }

.status-5g {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: -.4px;
}

.battery {
  position: relative;
  width: 23px;
  height: 11px;
  border: 1.3px solid rgba(255,255,255,.9);
  border-radius: 3px;
  padding: 1.5px;
  margin-left: 1px;
}

.battery::before {
  content: "";
  display: block;
  width: 75%;
  height: 100%;
  border-radius: 1px;
  background: #fff;
}

.battery::after {
  content: "";
  position: absolute;
  right: -3.5px;
  top: 2.5px;
  width: 2px;
  height: 4px;
  border-radius: 0 1px 1px 0;
  background: rgba(255,255,255,.85);
}

.layer{position:relative;z-index:2}
#power{background:#000;align-items:center;justify-content:center}
#power button{color:var(--sub);font-size:15px;padding:18px 28px}
#power .dot{width:10px;height:10px;border-radius:50%;background:var(--pink);margin:0 auto 14px;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.25}}
#lock .center{text-align:center;margin-top:48px}
#lock .date{font-size:19px;font-weight:500;color:rgba(255,255,255,.9)}
#lock .time{font-size:92px;font-weight:300;line-height:1.05;letter-spacing:-2px}
#lock .own{margin-top:6px;color:var(--sub);font-size:14px}
#lock .hint{margin-top:auto;padding:0 0 36px;text-align:center;color:rgba(255,255,255,.85);font-size:15px}
#lock .hint b{display:block;margin:0 auto 10px;width:140px;height:5px;border-radius:3px;background:rgba(255,255,255,.7)}
#pass .ttl{text-align:center;margin-top:46px;font-size:19px}
#pass .sub{text-align:center;color:var(--sub);font-size:13px;margin-top:6px;min-height:18px}
.dots{display:flex;gap:18px;justify-content:center;margin:26px 0 20px}
.dots i{width:13px;height:13px;border:1.5px solid #fff;border-radius:50%}
.dots i.f{background:#fff}
.dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px 22px;justify-content:center;margin-top:8px}
.pad button{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.18);backdrop-filter:blur(14px);font-size:32px;font-weight:300}
.pad button:active{background:rgba(255,255,255,.4)}
.pad .e{background:none;backdrop-filter:none;cursor:default}
.pbot{margin-top:auto;display:flex;justify-content:space-between;padding:0 40px calc(env(safe-area-inset-bottom) + 28px);font-size:15px}
.widget{margin:20px 18px 6px;padding:16px 18px;border-radius:24px;background:rgba(255,255,255,.2);backdrop-filter:blur(18px)}
.widget .wt{font-size:13px;color:var(--sub)}
.widget .wx{font-size:20px;font-weight:500;margin-top:6px;line-height:1.35}
.widget .wh{font-size:12px;color:var(--sub);margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 8px;padding:22px 16px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;cursor:pointer}
.ic{width:60px;height:60px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.app.off{opacity:1;cursor:default}
.dock{margin:auto 12px calc(env(safe-area-inset-bottom) + 14px);padding:14px;border-radius:32px;background:rgba(255,255,255,.22);backdrop-filter:blur(20px);display:grid;grid-template-columns:repeat(4,1fr)}
.dock .app span{display:none}
.app-screen{background:#fff;color:#111}
.hdr{flex:none;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 14px) 14px 10px;font-weight:700;font-size:18px;border-bottom:1px solid #eee;min-height:58px}
.hdr .bk{font-size:15px;font-weight:400;color:#6b5b8a;min-width:56px;text-align:left}
.hdr .sp{min-width:56px}
.body{flex:1;overflow-y:auto}
.hbar{flex:none;height:24px;display:flex;align-items:flex-start;justify-content:center;padding-top:6px;cursor:pointer}
.hbar i{width:130px;height:5px;border-radius:3px;background:#111;opacity:.8}
#photos .body{padding:2px}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.pg .pic{aspect-ratio:1;cursor:pointer}
.empty{padding:60px 20px;text-align:center;color:#999;font-size:14px}
#viewer{background:#000;color:#fff}
#viewer .hdr{border:0;color:#fff}
#viewer .vimg{flex:1;background-size:contain;background-repeat:no-repeat;background-color:#000}
#viewer .vimg .ph{font-size:60px}
#viewer .cap{padding:10px 22px 12px;text-align:center}
#viewer .cap b{display:block;font-size:17px}
#viewer .cap span{font-size:13px;color:var(--sub)}
#viewer .hbar i{background:#fff}
#kakao{background:#b2c7d9;color:#222}

.kd{text-align:center;margin:10px auto 14px;font-size:12px;color:#fff;background:rgba(0,0,0,.18);padding:4px 14px;border-radius:14px;width:max-content}

.kd.day-divider {

.m{display:flex;gap:8px;align-items:flex-end}
.m.me{flex-direction:row-reverse}
.m .av{width:40px;height:40px;border-radius:15px;flex:none;align-self:flex-start}
.m .nm{font-size:12px;color:#444;margin-bottom:3px}

.me .bub{background:#fee500}
.tm{font-size:10.5px;color:#556}

.kb i{width:130px;height:5px;border-radius:3px;background:#111;opacity:.8}

.ph1 .pic{width:34px;height:34px;border-radius:50%}
.post .main{aspect-ratio:1;width:100%}
.act{display:flex;gap:14px;padding:10px 12px 4px}
.act button{font-size:24px;line-height:1}
.post .lk{padding:0 12px;font-weight:700;font-size:14px}
.post .cp{padding:4px 12px;font-size:14px;line-height:1.45;white-space:pre-wrap}
.post .cm,.post .tt{padding:2px 12px;font-size:12.5px;color:#888}
#call{background:linear-gradient(180deg,#3a3350,#1c1a26);align-items:center;text-align:center}
#call .who{margin-top:70px}
#call .pic{width:120px;height:120px;border-radius:50%;margin:0 auto 18px}
#call .pic .ph{font-size:54px}
#call h2{font-size:30px;font-weight:500}
#call p{color:var(--sub);margin-top:8px;font-size:15px;padding:0 30px}
#call .btns{margin-top:auto;display:flex;gap:80px;padding-bottom:calc(env(safe-area-inset-bottom) + 70px)}
.cb{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px}
.cb i{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;font-style:normal}
.red i{background:#ff3b30}.grn i{background:#34c759}
#call .on-call{display:none}
#call.live .on-call{display:flex}
#call.live .ringing{display:none}
#call p.on-call{display:none}
#call.live p.on-call{display:block}
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(30,30,34,.9);padding:9px 16px;border-radius:16px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:9;white-space:nowrap}
.toast.s{opacity:1}


.app-badge {
  position: absolute;
  top: -5px;
  right: -5px;
  min-width: 20px;
  height: 20px;
  padding: 0 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  border-radius: 999px;
  background: #ff3b30;
  color: white;
  font-size: 12px;
  font-weight: 700;
  line-height: 1;
  border: 1.5px solid white;
  z-index: 10;
}

/* 민제의 새 카카오톡 알림 배너 */
.message-banner {
  position: absolute;
  z-index: 99;
  top: calc(env(safe-area-inset-top) + 48px);
  left: 12px;
  right: 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 15px;
  border-radius: 22px;
  background: rgba(248, 248, 250, 0.94);
  color: #222;
  box-shadow: 0 5px 22px rgba(0, 0, 0, 0.18);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  opacity: 0;
  transform: translateY(-18px);
  transition: opacity 0.3s ease, transform 0.3s ease;
  pointer-events: none;
}

.message-banner.visible {
  opacity: 1;
  transform: translateY(0);
}

.message-banner-icon {
  width: 44px;
  height: 44px;
  flex-shrink: 0;
  border-radius: 12px;
  background: #fee500;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 25px;
}

.message-banner-content {
  flex: 1;
  min-width: 0;
}

.message-banner-top {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 3px;
  font-size: 12px;
  color: #777;
}

.message-banner-name {
  font-size: 14px;
  font-weight: 700;
  color: #222;
  margin-bottom: 3px;
}

.message-banner-text {
  font-size: 13px;
  color: #333;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
</style>

  if (!url) return;
  const i = new Image();
  i.onload = () => { node.style.backgroundImage = 'url("' + url.replace(/"/g, '%22') + '")'; node.classList.add('ok'); };
  i.src = url;
}
function pic(url, cls, fb) {
  const w = el('div', 'pic ' + (cls || '')); w.appendChild(el('span', 'ph', fb || '✿')); setImg(w, url); return w;
}
function screen(id, cls) { const s = el('section', 'screen ' + (cls || '')); s.id = id; $('#phone').appendChild(s); return s; }
function header(title) {
  const h = el('div', 'hdr'), b = el('button', 'bk', '‹ 뒤로'); b.dataset.back = '1';
  h.append(b, el('span', '', title), el('span', 'sp')); return h;
}
function hbar(cls) { const b = el('div', cls || 'hbar'); b.dataset.home = '1'; b.appendChild(el('i')); return b; }
function toast(t) { const n = $('.toast'); n.textContent = t; n.classList.add('s'); clearTimeout(toast.t); toast.t = setTimeout(() => n.classList.remove('s'), 1600); }

/* ------------------------- 화면 이동 ------------------------- */
let cur = 'power'; const hist = [];
function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); cur = id; }
function go(id) { hist.push(cur); show(id); }
function back() { show(hist.pop() || 'home'); }
function home() { hist.length = 0; show('home'); }

/* ------------------------- 화면별 렌더링 ------------------------- */
function clockText() {
  const d = new Date();
  return {
    date: d.toLocaleDateString('ja-JP', { month: 'long', day: 'numeric', weekday: 'long' }),
    time: String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'),
    short: d.toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' })
  };
}

function statusBar() {
  const s = el('div', 'status');
  const clock = el('span', 'sclock');

  const icons = el('div', 'status-icons');
  const signal = el('div', 'signal');

  for (let i = 0; i < 4; i++) {
    signal.appendChild(el('i'));
  }

  icons.append(
    signal,
    el('span', 'status-5g', '5G'),
    el('div', 'battery')
  );

  s.append(clock, icons);
  return s;
}

function tickClock() {
  const c = clockText();
  document.querySelectorAll('.sclock').forEach(n => n.textContent = c.short);
  $('#lock .date').textContent = c.date; $('#lock .time').textContent = c.time;
}

function renderPower() {
  const s = screen('power'), b = el('button');
  b.append(el('div', 'dot'), document.createTextNode('눌러서 전원 켜기'));
  b.onclick = () => show('lock'); s.appendChild(b);
}

function renderLock() {
  const s = screen('lock'), w = el('div', 'wall lockw'); setImg(w, S.wallpapers.lock); s.appendChild(w);
  s.appendChild(statusBar());
  const c = el('div', 'layer center'); c.append(el('div', 'date'), el('div', 'time'), el('div', 'own', S.owner + 'のiPhone'));
  const h = el('div', 'layer hint'); h.append(el('b'), document.createTextNode('눌러서 암호 입력'));
  s.append(c, h); s.onclick = () => { resetPass(); show('pass'); };
}

let typed = '';
function drawDots() { document.querySelectorAll('#pass .dots i').forEach((d, i) => d.classList.toggle('f', i < typed.length)); }
function resetPass() { typed = ''; drawDots(); const m = $('#pass .sub'); if (m) m.textContent = S.passcodeHint || ''; }
function renderPass() {
  const s = screen('pass'), w = el('div', 'wall lockw'); setImg(w, S.wallpapers.lock); s.appendChild(w);
  s.appendChild(statusBar());
  const len = String(S.passcode).length;
  const t = el('div', 'layer ttl', '암호 입력'), sub = el('div', 'layer sub', S.passcodeHint || '');
  const dots = el('div', 'layer dots'); for (let i = 0; i < len; i++) dots.appendChild(el('i'));
  const pad = el('div', 'layer pad');
  ['1','2','3','4','5','6','7','8','9','','0',''].forEach(k => {
    const b = el('button', k ? '' : 'e', k); if (k) b.onclick = () => press(k); pad.appendChild(b);
  });
  function press(k) {
    if (typed.length >= len) return; typed += k; drawDots();
    if (typed.length < len) return;
    if (typed === String(S.passcode)) setTimeout(() => { home(); armAutoRing(); }, 150);
    else { dots.classList.add('shake'); sub.textContent = '암호가 맞지 않아요'; setTimeout(() => { dots.classList.remove('shake'); typed = ''; drawDots(); }, 380); }
  }
  const bot = el('div', 'layer pbot'), em = el('button', '', '긴급 상황'), cn = el('button', '', '취소');
  em.onclick = () => toast('긴급 통화는 사용할 수 없어요'); cn.onclick = () => show('lock'); bot.append(em, cn);
  s.append(t, sub, dots, pad, bot);
}


function appIcon(a) {
  const d = el('div', 'app' + (a.enabled ? '' : ' off'));
  const i = el('div', 'ic');
  i.style.background = a.color || 'transparent';

  if (a.image) {
    const img = document.createElement('img');
    img.src = a.image;
    img.alt = a.name;
    img.style.width = '100%';
    img.style.height = '100%';
    img.style.objectFit = 'cover';
    img.style.borderRadius = 'inherit';
    i.appendChild(img);
  } else {
    i.textContent = a.icon || '';
  }

  
  // 카카오톡 읽지 않은 메시지 알림
  if (a.target === 'kakao' && S.kakao.unreadCount > 0) {
    const badge = el('div', 'app-badge', S.kakao.unreadCount);
    i.style.position = 'relative';
    i.appendChild(badge);
  }

  d.append(i, el('span', '', a.name));

  if (a.enabled && a.target) {
    d.onclick = () => {
      if (a.target === 'call') {
        ring();
      } else {
        if (a.target === 'kakao') {
          S.kakao.unreadCount = 0;
        }
        go(a.target);
      }
    };
  }

  return d;
}

function renderHome() {
  const s = screen('home'), w = el('div', 'wall homew'); setImg(w, S.wallpapers.home); s.appendChild(w);
  s.appendChild(statusBar());
  const wd = S.home.widget, wg = el('div', 'layer widget');
  wg.append(el('div', 'wt', wd.title), el('div', 'wx', wd.text), el('div', 'wh', wd.time));
  const g = el('div', 'layer grid'); S.home.apps.filter(a => !a.dock).forEach(a => g.appendChild(appIcon(a)));
  const dk = el('div', 'layer dock'); S.home.apps.filter(a => a.dock).forEach(a => dk.appendChild(appIcon(a)));
  s.append(wg, g, dk);
}

function renderPhotos() {
  const s = screen('photos', 'app-screen'); s.appendChild(header('사진'));
  const b = el('div', 'body'), g = el('div', 'pg');
  S.photos.forEach(p => { const t = pic(p.image, '', '🌸'); t.onclick = () => openPhoto(p); g.appendChild(t); });
  if (!S.photos.length) b.appendChild(el('div', 'empty', '사진이 없어요'));
  b.appendChild(g); s.append(b, hbar());
  const v = screen('viewer'), img = el('div', 'vimg pic'); img.appendChild(el('span', 'ph', '🌸'));
  const cap = el('div', 'cap'), ct = el('b'), cd = el('span'); cap.append(ct, cd);
  v.append(header(''), img, cap, hbar());
  window.openPhoto = p => {
    img.style.backgroundImage = ''; img.classList.remove('ok'); setImg(img, p.image);
    ct.textContent = p.title || ''; cd.textContent = p.date || ''; go('viewer');
  };
}

function renderKakao() {
  const K = S.kakao, s = screen('kakao');
  s.appendChild(header(K.name));

  const b = el('div', 'body');
  const list = el('div', 'msgs');
  let currentDay = '';

  K.messages.forEach(m => {
    // 날짜가 바뀌면 구분선 표시
    if (m.day && m.day !== currentDay) {
      list.appendChild(el('div', 'kd day-divider', m.day));
      currentDay = m.day;
    }

    const mine = m.from === 'me';
    const row = el('div', 'm' + (mine ? ' me' : ''));

    if (!mine) row.appendChild(pic(K.avatar, 'av', '🙂'));

    const col = el('div');
    if (!mine) col.appendChild(el('div', 'nm', K.name));

    col.appendChild(el('div', 'bub', m.text));
    row.append(col, el('span', 'tm', m.time || ''));
    list.appendChild(row);
  });

  const inp = el('div', 'kin');
  inp.append(el('div', '', '메시지 입력'), el('span', '', '＋'));

  b.appendChild(list);
  s.append(b, inp, hbar('kb'));
}


let kakaoNewMessageSent = false;

function openKakaoChat() {
  if (kakaoNewMessageSent) return;

  setTimeout(() => {
    const K = S.kakao;
    const list = document.querySelector('#kakao .msgs');

    if (!list) return;

    const now = new Date();
    const time = now.toLocaleTimeString('ko-KR', {
      hour: 'numeric',
      minute: '2-digit',
      hour12: true
    });

    const message = {
      day: '2026년 10월 24일 토요일',
      from: 'them',
      text: '이주 잘 오고 있는 거 맞아?',
      time: time
    };

    K.messages.push(message);

    const row = el('div', 'm');
    row.appendChild(pic(K.avatar, 'av', '🙂'));

    const col = el('div');
    col.appendChild(el('div', 'nm', K.name));
    col.appendChild(el('div', 'bub', message.text));

    row.append(col, el('span', 'tm', message.time));
    list.appendChild(row);

    list.scrollTop = list.scrollHeight;
    kakaoNewMessageSent = true;
  }, 2000);
}


function renderInsta() {
  const I = S.instagram, s = screen('insta', 'app-screen'); s.appendChild(header('Instagram'));
  const b = el('div', 'body'), st = el('div', 'stories');
  I.stories.forEach(x => { const d = el('div', 'st'), r = el('div', 'ring'); r.appendChild(pic(x.image, '', '🙂')); d.append(r, el('span', '', x.name)); st.appendChild(d); });
  b.appendChild(st);
  I.posts.forEach(p => {
    const d = el('article', 'post'), top = el('div', 'ph1'); top.append(pic(p.avatar, '', '🙂'), el('span', '', p.user));
    const act = el('div', 'act'), heart = el('button', '', '♡'), lk = el('div', 'lk'); let n = Number(p.likes) || 0, on = false;
    const paint = () => { lk.textContent = '좋아요 ' + n.toLocaleString('ko-KR') + '개'; heart.textContent = on ? '♥' : '♡'; heart.style.color = on ? '#ed4956' : ''; };
    heart.onclick = () => { on = !on; n += on ? 1 : -1; paint(); }; paint();
    act.append(heart, el('button', '', '💬'), el('button', '', '✈️'));
    const cp = el('div', 'cp'); cp.append(el('b', '', p.user + ' '), document.createTextNode(p.caption || ''));
    d.append(top, pic(p.image, 'main', '📷'), act, lk, cp, el('div', 'cm', p.comments || ''), el('div', 'tt', p.time || ''));
    b.appendChild(d);
  });
  s.append(b, hbar());
}

/* ------------------------- 전화 ------------------------- */
let callTimer = null, autoT = null;
function renderCall() {
  const C = S.call, s = screen('call'), who = el('div', 'layer who');
  who.append(pic(C.avatar, '', '🙂'), el('h2', '', C.name), el('p', 'ringing', C.text), el('p', 'on-call', ''));
  const rb = el('div', 'layer btns ringing'), ob = el('div', 'layer btns on-call');
  const mk = (cls, ic, label, fn) => { const b = el('button', 'cb ' + cls); b.append(el('i', '', ic), el('span', '', label)); b.onclick = fn; return b; };
  rb.append(mk('red', '✕', '거절', endCall), mk('grn', '✆', '수락', accept));
  ob.append(mk('red', '✕', '통화 종료', endCall));
  s.append(who, rb, ob);
}
function ring() { clearInterval(callTimer); $('#call').classList.remove('live'); if (cur !== 'call') go('call'); }
function accept() {
  $('#call').classList.add('live'); const t = $('#call p.on-call'); let sec = 0;
  const upd = () => { t.textContent = S.call.acceptedText + '  ' + String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0'); };
  upd(); clearInterval(callTimer); callTimer = setInterval(() => { sec++; upd(); }, 1000);
}
function endCall() { clearInterval(callTimer); $('#call').classList.remove('live'); back(); }
function armAutoRing() {
  clearTimeout(autoT); const n = Number(S.call.autoRingAfterSec) || 0;
  if (n > 0) autoT = setTimeout(() => { if (cur === 'home') ring(); }, n * 1000);
}

/* ------------------------- 시작 ------------------------- */
(function init() {
  renderPower(); renderLock(); renderPass(); renderHome(); renderPhotos(); renderKakao(); renderInsta(); renderCall();
  $('#phone').appendChild(el('div', 'toast'));
  document.addEventListener('click', e => {           // 이벤트 위임: 한 번만 등록
    const t = e.target.closest('[data-back],[data-home]'); if (!t) return;
    if (t.dataset.home) home(); else back();
  });
  tickClock(); setInterval(tickClock, 1000); show('power');
})();
</script>
</body>
</html>
